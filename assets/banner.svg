<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#276DC3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#035a7d;stop-opacity:1" />
    </linearGradient>
    <style>
      .title { font: bold 42px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; }
      .subtitle { font: 20px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #8b949e; letter-spacing: 3px; }
      .bar { fill: url(#grad); }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="250" rx="15" fill="#0d1117" />
  
  <!-- Text -->
  <text x="50" y="110" class="title">Alexandro Mayoral Terán</text>
  <text x="50" y="150" class="subtitle">DATA ANALYST • R • VISUALIZATIONS • MUSIC</text>

  <!-- Animated Bar Chart / Waveform -->
  <g transform="translate(600, 180) scale(1, -1)">
    <!-- Bar 1 -->
    <rect x="0" y="0" width="15" height="40" rx="4" class="bar">
      <animate attributeName="height" values="40;80;40" dur="1.5s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 2 -->
    <rect x="25" y="0" width="15" height="70" rx="4" class="bar">
      <animate attributeName="height" values="70;110;70" dur="1.2s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 3 -->
    <rect x="50" y="0" width="15" height="100" rx="4" class="bar">
      <animate attributeName="height" values="100;40;100" dur="1.8s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 4 -->
    <rect x="75" y="0" width="15" height="60" rx="4" class="bar">
      <animate attributeName="height" values="60;120;60" dur="1.4s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 5 -->
    <rect x="100" y="0" width="15" height="85" rx="4" class="bar">
      <animate attributeName="height" values="85;50;85" dur="1.6s" repeatCount="indefinite" />
    </rect>
  </g>
  
  <!-- Decorative dots -->
  <circle cx="50" cy="190" r="5" fill="#276DC3" />
  <circle cx="70" cy="190" r="5" fill="#035a7d" />
  <circle cx="90" cy="190" r="5" fill="#8b949e" />
</svg>
